name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: test
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/assay
      NEON_AUTH_BASE_URL: https://example.invalid/api/auth
      NEON_AUTH_COOKIE_SECRET: ci-build-placeholder-secret-at-least-32-chars
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret hygiene
        run: bash scripts/check-secrets.sh

      - name: Build workspace packages
        run: pnpm --filter @assay/domain --filter @assay/crypto --filter @assay/contracts --filter @assay/storage --filter @assay/proof --filter @assay/db --filter @assay/document --filter @assay/ai --filter @assay/reppo --filter @assay/payments --filter @assay/financial-data build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build applications
        run: pnpm --filter @assay/api --filter @assay/web build
